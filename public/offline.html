<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors ligne · obext.js</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:1.5rem;background:#ECEEF0;color:#0A0A0B;font:400 17px/1.55 system-ui,sans-serif}
  main{max-width:30rem}
  img{width:64px;height:64px;display:block;margin-bottom:1.2rem}
  h1{font:900 clamp(2rem,9vw,3rem)/1 'Arial Black',Impact,sans-serif;letter-spacing:-.04em;margin:0 0 .8rem}
  p{color:#5A6068;margin:.4rem 0 1.4rem}
  button{font:700 1rem system-ui,sans-serif;padding:.8rem 1.4rem;border:1px solid #0A0A0B;background:#0A0A0B;color:#ECEEF0;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Pas de connexion.</h1>
  <p>Cette page n’a pas encore été ouverte sur cet appareil. Reconnecte-toi à Internet, puis réessaie. Les pages déjà visitées restent disponibles.<br><br>No connection. Reconnect and try again: pages you already visited stay available.</p>
  <button onclick="location.reload()">Réessayer / Retry</button>
</main>
</body>
</html>
